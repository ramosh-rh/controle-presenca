<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --ink:#172235; --paper:#f4f7fb; --moss:#2563eb; --moss-dark:#102a56;
  --clay:#ef4444; --line:#e5eaf2; --card:#ffffff; --danger:#dc2626;
  --muted:#64748b; --teal:#0f9d8a; --gold:#f59e0b; --shadow:0 12px 30px rgba(15,35,70,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}
button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:linear-gradient(180deg,#102a56 0%,#173e77 58%,#102a56 100%);color:#dbeafe;padding:22px 13px;flex-shrink:0;box-shadow:8px 0 30px rgba(16,42,86,.12);position:relative;z-index:2}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;padding:6px 15px 24px;margin-bottom:16px;display:flex;align-items:center;gap:9px;color:#fff}.brand:before{content:'✓';display:grid;place-items:center;width:34px;height:34px;background:#3b82f6;border-radius:11px;box-shadow:0 6px 16px rgba(59,130,246,.35);font-size:1.15rem}.brand span{color:#7dd3fc}
.nav-item{padding:12px 15px;margin:4px 0;cursor:pointer;font-size:.9rem;border:1px solid transparent;border-radius:11px;transition:all .2s ease;font-weight:600;color:#bfdbfe;display:flex;align-items:center;gap:11px}.nav-item:before{content:'•';font-size:1.2rem;color:#60a5fa;line-height:0;transition:transform .2s}.nav-item:hover{background:rgba(255,255,255,.09);transform:translateX(3px);color:#fff}.nav-item.active{background:linear-gradient(90deg,rgba(96,165,250,.26),rgba(96,165,250,.08));border-color:rgba(147,197,253,.22);box-shadow:inset 3px 0 #7dd3fc;color:#fff}.nav-item.active:before{content:'✦';color:#7dd3fc}
.main{flex:1;padding:28px 42px 48px;max-width:1440px;min-width:0}.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.userbar{font-size:.84rem;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;box-shadow:0 3px 12px rgba(15,35,70,.04)}.userbar b{color:var(--ink)}.userbar a{color:var(--moss);cursor:pointer;margin-left:12px;font-weight:700}.userbar a:hover{text-decoration:underline}
h1{font-size:clamp(1.55rem,2.5vw,2.05rem);letter-spacing:-.04em;margin:0 0 5px;color:#102a56}h2{color:#19365f}.sub{color:var(--muted);font-size:.92rem;margin-bottom:23px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-4px);box-shadow:0 18px 34px rgba(15,35,70,.13)}.stat:after{content:'';position:absolute;right:-25px;bottom:-35px;width:90px;height:90px;border-radius:50%;background:rgba(37,99,235,.07)}.stat .n{font-size:2rem;font-weight:850;color:#102a56;letter-spacing:-.05em}.stat .l{font-size:.78rem;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:5px}.stat .l:before{content:'●';font-size:.5rem;color:#3b82f6}
.table-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 8px 24px rgba(15,35,70,.05)}table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:13px 14px;border-bottom:1px solid #edf1f6;text-align:left;font-size:.86rem}th{background:#f8fafc;font-weight:750;color:#29466f;position:sticky;top:0;z-index:1;white-space:nowrap}tbody tr:hover,tr:hover td{background:#f8fbff}tr:last-child td{border-bottom:0}
.toolbar{display:flex;gap:11px;margin-bottom:18px;flex-wrap:wrap;align-items:flex-end}.toolbar .fgroup{display:flex;flex-direction:column;gap:6px}.toolbar .fgroup label,.field label{font-size:.76rem;color:var(--muted);font-weight:750;letter-spacing:.02em}input,select,textarea{font-size:.88rem;padding:10px 12px;border:1px solid #dbe3ef;border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.15)}button{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:750;padding:10px 14px;box-shadow:0 6px 14px rgba(37,99,235,.2);transition:transform .18s,box-shadow .18s,filter .18s}button:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 9px 18px rgba(37,99,235,.26)}button:active{transform:translateY(0)}button.secondary{background:#fff;color:#1d4ed8;border:1px solid #bfdbfe;box-shadow:none}button.secondary:hover{background:#eff6ff}button.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 6px 14px rgba(220,38,38,.18)}.btnrow{display:flex;gap:6px;flex-wrap:wrap}.btnrow button{font-size:.76rem;padding:7px 9px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.74rem;color:#fff;font-weight:750;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.08)}.badge:before{content:'●';font-size:.5rem;color:rgba(255,255,255,.8)}
.modal-bg{position:fixed;inset:0;background:rgba(15,31,58,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}.modal{background:#fff;border-radius:20px;padding:28px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;border:1px solid #e5eaf2;box-shadow:0 24px 70px rgba(15,35,70,.25);animation:modalIn .22s ease}@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}.modal h2{margin-top:0;font-size:1.3rem;letter-spacing:-.03em}.field{margin-bottom:14px}.field input,.field select,.field textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#3b82f6 0,#143b79 35%,#0b1c3b 100%);padding:20px}.login-box{background:rgba(255,255,255,.97);padding:40px;border-radius:24px;width:390px;max-width:100%;box-shadow:0 25px 70px rgba(0,0,0,.25)}.login-box h1{font-size:2rem}.login-box button{width:100%;margin-top:6px}.login-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:.8rem}.login-links a{color:var(--moss);cursor:pointer;text-decoration:none;font-weight:700}.login-links a:hover{text-decoration:underline}.hint{font-size:.78rem;color:var(--muted);margin-top:16px;line-height:1.5}.problem-box{max-height:220px;overflow:auto;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:12px 14px;font-size:.82rem;color:#9f1239;margin-top:10px}.ok-box{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:12px 14px;font-size:.85rem;color:#047857;margin-top:10px}hr{border-color:var(--line)!important}
.page-hero{display:flex;justify-content:space-between;gap:20px;align-items:center;background:linear-gradient(135deg,#eff6ff,#fff);border:1px solid #dbeafe;border-radius:20px;padding:22px 24px;margin-bottom:20px;box-shadow:0 8px 22px rgba(37,99,235,.06)}.page-hero h1{margin:0}.hero-note{color:#49658c;font-size:.84rem;max-width:560px}.pulse{display:inline-block;width:9px;height:9px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 5px rgba(34,197,94,.15);margin-right:8px}.insight-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:24px}.insight-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.progress{height:10px;background:#eaf0f7;border-radius:99px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22c55e,#0f9d8a);transition:width .5s}.empty-state{text-align:center;padding:30px 18px!important;color:var(--muted)}
@media(max-width:900px){.sidebar{width:205px}.main{padding:22px 20px 36px}.insight-grid{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:12px 10px;display:flex;align-items:center;gap:5px;overflow-x:auto;position:sticky;top:0}.brand{font-size:1rem;padding:5px 8px;margin:0 6px 0 0;white-space:nowrap}.brand:before{width:28px;height:28px;border-radius:9px}.nav-item{font-size:.75rem;padding:9px 10px;white-space:nowrap;margin:0}.nav-item:before{display:none}.main{padding:18px 13px 32px}.top-actions{justify-content:flex-end}.userbar{font-size:.75rem}.page-hero{display:block;padding:18px}.page-hero button{margin-top:14px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px}.stat .n{font-size:1.6rem}th,td{padding:11px 9px;white-space:nowrap}.table-scroll{margin-right:-3px}.toolbar{align-items:stretch}.toolbar .fgroup{flex:1;min-width:130px}.toolbar button{width:100%}.modal{padding:22px 18px}}
.loading-screen {display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:var(--paper);color:var(--moss-dark);font-size:1.2rem;font-weight:700;}
.loading-spinner {border:4px solid rgba(37,99,235,.2);border-top-color:#3b82f6;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin-bottom:15px;}
@keyframes spin {to {transform: rotate(360deg);}}
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    Conectando ao banco de dados...
  </div>
</div>

<script>
// ================== CONFIGURAÇÃO DO FIREBASE ==================
const firebaseConfig = {
  apiKey: "AIzaSyCdscx86MntuXmTzX87Tdwb3XbFbvTdj7w",
  authDomain: "controle-presenca-d55c4.firebaseapp.com",
  projectId: "controle-presenca-d55c4",
  storageBucket: "controle-presenca-d55c4.firebasestorage.app",
  messagingSenderId: "743343120094",
  appId: "1:743343120094:web:ea30489b70659d8546ac4f"
};

// Inicializa o Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ================== ESTADO E BANCO DE DADOS ==================
const TIPOS = {
  'Presença': {cor:'#1e4d8b', conta:'presenca'},
  'Falta': {cor:'#c0392b', conta:'ausencia'},
  'Saída antecipada': {cor:'#8a5a3b', conta:'presenca'},
  'Férias': {cor:'#2e7bbf', conta:'afastamento'},
  'Atestado': {cor:'#7a3b8a', conta:'afastamento'},
  'Declaração': {cor:'#a67b1e', conta:'afastamento'},
  'Licença-maternidade': {cor:'#b0396f', conta:'afastamento'},
  'Suspensão': {cor:'#555555', conta:'afastamento'},
};

// Dados Padrão (Usado no primeiro acesso)
let state = {
  usuarios: [
    {id:1, nome:'Administrador', email:'admin@empresa.com', senha:'admin123', nivel:'Administrador', ativo:true}
  ],
  loggedUser: null,
  colaboradores: [],
  registros: {}, 
  historico: [], 
  auditoria: [],
  nextColabId: 1,
  nextUserId: 2,
  nextHistId: 1,
};

let isDataLoaded = false;

// Conecta e carrega os dados da nuvem
db.collection("sistema_presenca").doc("dados_gerais").get().then((doc) => {
  if (doc.exists) {
    // Se já existem dados, carrega pro sistema
    const cloudData = doc.data();
    state = {...state, ...cloudData};
    // Mantém o usuário deslogado na atualização de página por segurança
    state.loggedUser = null; 
  } else {
    // Primeiro acesso: Salva os dados padrão iniciais na nuvem
    saveDataToFirebase();
  }
  isDataLoaded = true;
  render();
}).catch((error) => {
  alert("Erro de conexão. Verifique sua internet ou a configuração do Firebase.");
  isDataLoaded = true;
  render();
});

// Função para gravar alterações na nuvem
function saveDataToFirebase() {
  if (isDataLoaded) {
    // Clonamos o estado e removemos o usuário logado para não salvar a sessão permanentemente
    const stateToSave = {...state};
    delete stateToSave.loggedUser; 
    db.collection("sistema_presenca").doc("dados_gerais").set(stateToSave);
  }
}


function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function logAudit(msg){ state.auditoria.unshift({msg, ts:new Date().toLocaleString('pt-BR')}); saveDataToFirebase(); }

function applyPeriodo(colaboradorId, tipo, inicio, fim, obs){
  let cur = inicio;
  while(cur <= fim){
    state.registros[colaboradorId+'|'+cur] = {tipo, obs: obs||''};
    cur = addDays(cur,1);
  }
  state.historico.unshift({id: state.nextHistId++, colaboradorId, tipo, inicio, fim, obs: obs||'', dias: diffDays(inicio,fim)+1});
  const colab = state.colaboradores.find(c=>c.id===colaboradorId);
  logAudit(`${state.loggedUser?.nome||'Sistema'} lançou "${tipo}" para ${colab?.nome} de ${fmtDate(inicio)} a ${fmtDate(fim)}.`);
}

function excluirRegistrosDoPeriodo(hist){
  let cur = hist.inicio;
  while(cur <= hist.fim){
    const key = hist.colaboradorId+'|'+cur;
    if(state.registros[key] && state.registros[key].tipo === hist.tipo) delete state.registros[key];
    cur = addDays(cur,1);
  }
}

// ================== NORMALIZAÇÃO DE TEXTO ==================
function normKey(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
const COLUMN_MAP = {
  'nome':'nome', 'nome completo':'nome', 'colaborador':'nome', 'funcionario':'nome',
  'matricula':'matricula', 'matricula ':'matricula', 'registro':'matricula',
  'cpf':'cpf',
  'cargo':'cargo', 'funcao':'cargo',
  'depto':'depto', 'departamento':'depto', 'setor':'depto',
  'admissao':'admissao', 'data de admissao':'admissao', 'dt admissao':'admissao',
  'status':'status',
  'filial':'filial',
};

function excelDateToISO(v){
  if(v===''||v==null) return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(!d) return '';
    return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = v.toString().trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}

// ================== RENDERIZAÇÃO ==================
const root = document.getElementById('root');
let currentTab = 'dashboard';
let loginMode = 'login';
let modal = null;
let filterDate = todayISO();
let searchTerm = '';
let relInicio = todayISO();
let relFim = todayISO();
let relColabId = 'todos';
let importState = null; 

function removeModalNodes(){
  document.querySelectorAll('.modal-bg').forEach(el=>el.remove());
}

function render(){
  if(!isDataLoaded) return; // Aguarda o banco carregar

  removeModalNodes();
  if(!state.loggedUser){ renderLogin(); return; }
  root.innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="brand">Presença<span>·RH</span></div>
        ${navItem('dashboard','Dashboard')}
        ${navItem('colaboradores','Colaboradores')}
        ${navItem('presenca','Controle Diário')}
        ${navItem('relatorios','Relatórios')}
        ${navItem('importexport','Importar / Exportar')}
        ${navItem('usuarios','Usuários')}
        ${navItem('auditoria','Auditoria')}
        <div style="margin:22px 12px 0;padding:13px 12px;border:1px solid rgba(147,197,253,.16);border-radius:13px;background:rgba(255,255,255,.06);font-size:.72rem;color:#bfdbfe;line-height:1.45"><span class="pulse"></span>Sistema em nuvem<br><b style="color:#fff">Conectado e salvo</b></div>
      </div>
      <div class="main" id="main"></div>
    </div>
  `;
  document.querySelectorAll('.nav-item').forEach(el=>{ el.onclick = ()=>{ currentTab = el.dataset.tab; modal=null; render(); }; });
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="top-actions">
      <div></div>
      <div class="userbar"><b>${state.loggedUser.nome}</b> (${state.loggedUser.nivel}) <a id="logout">Sair</a></div>
    </div>
  ` + tabContent();
  document.getElementById('logout').onclick = ()=>{ state.loggedUser=null; render(); };
  bindTabEvents();
  if(modal) renderModal();
}
function navItem(tab,label){ return `<div class="nav-item ${currentTab===tab?'active':''}" data-tab="${tab}">${label}</div>`; }

function tabContent(){
  if(currentTab==='dashboard') return renderDashboard();
  if(currentTab==='colaboradores') return renderColaboradores();
  if(currentTab==='presenca') return renderPresenca();
  if(currentTab==='relatorios') return renderRelatorios();
  if(currentTab==='importexport') return renderImportExport();
  if(currentTab==='usuarios') return renderUsuarios();
  if(currentTab==='auditoria') return renderAuditoria();
  return '';
}

// ---- Dashboard ----
function renderDashboard(){
  const ativos = state.colaboradores.filter(c=>c.status!=='Demitido');
  const today = todayISO();
  let presentes=0, faltas=0, ferias=0, atestado=0, suspensao=0, saidaAnt=0;
  ativos.forEach(c=>{
    const r = state.registros[c.id+'|'+today];
    if(r){
      if(r.tipo==='Presença') presentes++;
      else if(r.tipo==='Falta') faltas++;
      else if(r.tipo==='Férias') ferias++;
      else if(r.tipo==='Atestado') atestado++;
      else if(r.tipo==='Suspensão') suspensao++;
      else if(r.tipo==='Saída antecipada') saidaAnt++;
    }
  });
  const taxa = ativos.length ? Math.round((presentes / ativos.length) * 100) : 0;
  return `
    <div class="page-hero"><div><h1>Bom trabalho, ${state.loggedUser?.nome?.split(' ')[0] || 'equipe'}!</h1><div class="hero-note"><span class="pulse"></span>Painel atualizado para ${fmtDate(today)}. Acompanhe a rotina da equipe em um só lugar.</div></div><button id="heroPresence">Abrir controle diário</button></div>
    <div class="cards">
      ${stat(ativos.length,'Funcionários ativos')}
      ${stat(presentes,'Presentes hoje')}
      ${stat(faltas,'Faltas hoje')}
      ${stat(ferias,'De férias')}
      ${stat(atestado,'Com atestado')}
      ${stat(suspensao,'Suspensos')}
      ${stat(saidaAnt,'Saída antecipada')}
    </div>
    <div class="insight-grid"><div class="insight-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>Taxa de presença hoje</b><strong style="color:#0f9d8a;font-size:1.35rem">${taxa}%</strong></div><div class="progress"><i style="width:${taxa}%"></i></div><small style="color:var(--muted)">${presentes} de ${ativos.length} colaborador(es) ativo(s) com presença lançada.</small></div><div class="insight-card"><b>Atalhos rápidos</b><div class="btnrow" style="margin-top:14px"><button class="secondary" id="heroColab">+ Colaborador</button><button class="secondary" id="heroReport">Ver relatórios</button></div></div></div>
    <h2 style="font-size:1.1rem;">Últimos lançamentos de período</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Dias</th><th>Obs.</th></tr>
      ${state.historico.slice(0,8).map(h=>{
        const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
        return `<tr><td>${c?.nome||'—'}</td><td>${tipoBadge(h.tipo)}</td><td>${fmtDate(h.inicio)}</td><td>${fmtDate(h.fim)}</td><td>${h.dias}</td><td>${h.obs||'—'}</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="empty-state">Nenhum lançamento ainda. Os novos registros aparecerão aqui.</td></tr>'}
    </table></div>
  `;
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
function tipoBadge(tipo){ const cor = TIPOS[tipo]?.cor || '#777'; return `<span class="badge" style="background:${cor}">${tipo}</span>`; }
function statusBadge(status){
  const cores = {'Ativo':'#1e4d8b','Férias':'#2e7bbf','Afastado':'#7a3b8a','Suspenso':'#555','Demitido':'#c0392b'};
  return `<span class="badge" style="background:${cores[status]||'#777'}">${status}</span>`;
}

// ---- Colaboradores ----
function renderColaboradores(){
  const term = normKey(searchTerm);
  const list = state.colaboradores.filter(c=> normKey(c.nome).includes(term) || (c.matricula||'').includes(searchTerm));
  return `
    <h1>Colaboradores</h1>
    <div class="sub">${state.colaboradores.length} cadastrado(s) — cadastro, edição, exclusão e histórico</div>

// ---- Relatórios ----
function renderRelatorios(){
  const inRange = state.historico.filter(h=>{
    if(relColabId!=='todos' && h.colaboradorId!==+relColabId) return false;
    return h.inicio <= relFim && h.fim >= relInicio;
  });

  const diarios = [];
  Object.keys(state.registros).forEach(key=>{
    const [cid, data] = key.split('|');
    if(data < relInicio || data > relFim) return;
    if(relColabId!=='todos' && +cid !== +relColabId) return;
    diarios.push({colaboradorId:+cid, data, ...state.registros[key]});
  });
  diarios.sort((a,b)=>a.data.localeCompare(b.data));

  return `
    <h1>Relatórios</h1>
    <div class="sub">Consulte tudo o que já foi salvo — lançamentos de período e marcações diárias</div>
    <div class="toolbar">
      <div class="fgroup"><label>Colaborador</label>
        <select id="rel_colab">
          <option value="todos" ${relColabId==='todos'?'selected':''}>Todos</option>
          ${state.colaboradores.map(c=>`<option value="${c.id}" ${relColabId==(''+c.id)?'selected':''}>${c.nome}</option>`).join('')}
        </select>
      </div>
      <div class="fgroup"><label>De</label><input type="date" id="rel_inicio" value="${relInicio}"></div>
      <div class="fgroup"><label>Até</label><input type="date" id="rel_fim" value="${relFim}"></div>
      <button id="rel_buscar">Buscar</button>
    </div>

    <h2 style="font-size:1.05rem;">Períodos lançados</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Dias</th><th>Obs.</th><th>Ações</th></tr>
      ${inRange.map(h=>{
        const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
        return `<tr><td>${c?.nome||'(excluído)'}</td><td>${tipoBadge(h.tipo)}</td><td>${fmtDate(h.inicio)}</td><td>${fmtDate(h.fim)}</td><td>${h.dias}</td><td>${h.obs||'—'}</td>
          <td><button class="danger" data-delhist="${h.id}">Excluir</button></td></tr>`;
      }).join('') || '<tr><td colspan="7">Nenhum período no intervalo.</td></tr>'}
    </table></div>

    <h2 style="font-size:1.05rem;margin-top:22px;">Marcações diárias no período</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Data</th><th>Situação</th><th>Observação</th><th>Ações</th></tr>
      ${diarios.map(d=>{
        const c = state.colaboradores.find(x=>x.id===d.colaboradorId);
        return `<tr><td>${c?.nome||'(excluído)'}</td><td>${fmtDate(d.data)}</td><td>${tipoBadge(d.tipo)}</td><td>${d.obs||'—'}</td>
          <td><button class="danger" data-delreg="${d.colaboradorId}|${d.data}">Excluir</button></td></tr>`;
      }).join('') || '<tr><td colspan="5">Nenhuma marcação diária no intervalo.</td></tr>'}
    </table></div>
  `;
}

// ================== EVENTOS POR ABA ==================
function bindTabEvents(){
  if(currentTab==='dashboard'){
    document.getElementById('heroPresence')?.addEventListener('click',()=>{ currentTab='presenca'; render(); });
    document.getElementById('heroColab')?.addEventListener('click',()=>{ currentTab='colaboradores'; modal={type:'colab'}; render(); });
    document.getElementById('heroReport')?.addEventListener('click',()=>{ currentTab='relatorios'; render(); });
  }
  if(currentTab==='colaboradores'){
    document.getElementById('searchColab').oninput = e=>{ searchTerm=e.target.value; render(); const inp=document.getElementById('searchColab'); inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; };
    document.getElementById('novoColab').onclick = ()=>{ modal={type:'colab'}; render(); };
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ modal={type:'colab', id:+b.dataset.edit}; render(); });
    document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{ modal={type:'hist', id:+b.dataset.hist}; render(); });
    document.querySelectorAll('[data-fire]').forEach(b=>b.onclick=()=>{
      const c = state.colaboradores.find(x=>x.id===+b.dataset.fire);
      c.status='Demitido';
      logAudit(`${state.loggedUser.nome} desligou ${c.nome}.`);
      saveDataToFirebase();
      render();
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const c = state.colaboradores.find(x=>x.id===+b.dataset.del);
      if(!confirm(`Excluir definitivamente ${c.nome}? Isso também remove seu histórico e marcações.`)) return;
      state.colaboradores = state.colaboradores.filter(x=>x.id!==c.id);
      state.historico = state.historico.filter(h=>h.colaboradorId!==c.id);
      Object.keys(state.registros).forEach(k=>{ if(k.startsWith(c.id+'|')) delete state.registros[k]; });
      logAudit(`${state.loggedUser.nome} excluiu o colaborador ${c.nome}.`);
      saveDataToFirebase();
      render();
    });
  }
  if(currentTab==='presenca'){
    document.getElementById('filterDate').onchange = e=>{ filterDate=e.target.value; render(); };
    document.getElementById('lancarPeriodo').onclick = ()=>{ modal={type:'periodo'}; render(); };
    document.querySelectorAll('[data-quick]').forEach(sel=>{
      sel.onchange = ()=>{
        if(!sel.value) return;
        const cid = +sel.dataset.quick;
        state.registros[cid+'|'+filterDate] = {tipo: sel.value, obs:''};
        const c = state.colaboradores.find(x=>x.id===cid);
        logAudit(`${state.loggedUser.nome} marcou ${c.nome} como "${sel.value}" em ${fmtDate(filterDate)}.`);
        saveDataToFirebase();
        
        const statusCell = document.getElementById('status-quick-'+cid);
        const obsCell = document.getElementById('obs-quick-'+cid);
        if(statusCell) statusCell.innerHTML = tipoBadge(sel.value);
        if(obsCell) obsCell.innerHTML = '—';
      };
    });
  }
  if(currentTab==='relatorios'){
    document.getElementById('rel_buscar').onclick = ()=>{
      relColabId = document.getElementById('rel_colab').value;
      relInicio = document.getElementById('rel_inicio').value;
      relFim = document.getElementById('rel_fim').value;
      render();
    };
    document.querySelectorAll('[data-delhist]').forEach(b=>b.onclick=()=>{
      const id = +b.dataset.delhist;
      const h = state.historico.find(x=>x.id===id);
      if(!h) return;
      if(!confirm('Excluir este período lançado? As marcações diárias correspondentes também serão removidas.')) return;
      excluirRegistrosDoPeriodo(h);
      state.historico = state.historico.filter(x=>x.id!==id);
      logAudit(`${state.loggedUser.nome} excluiu o lançamento "${h.tipo}".`);
      saveDataToFirebase();
      render();
    });
    document.querySelectorAll('[data-delreg]').forEach(b=>b.onclick=()=>{
      const [cid,data] = b.dataset.delreg.split('|');
      if(!confirm('Excluir esta marcação diária?')) return;
      delete state.registros[cid+'|'+data];
      logAudit(`${state.loggedUser.nome} excluiu a marcação de ${fmtDate(data)}.`);
      saveDataToFirebase();
      render();
    });
  }
  if(currentTab==='importexport'){
    document.getElementById('fileImport').onchange = handleImportFile;
    document.getElementById('exportColab').onclick = exportColaboradores;
    document.getElementById('exportHist').onclick = exportHistorico;
    document.getElementById('exportPresenca').onclick = exportPresenca;
  }
  if(currentTab==='usuarios'){
    document.getElementById('novoUsuario').onclick = ()=>{ modal={type:'user'}; render(); };
    document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=()=>{
      const u = state.usuarios.find(x=>x.id===+b.dataset.toggleuser);
      u.ativo = !u.ativo;
      logAudit(`${state.loggedUser.nome} ${u.ativo?'ativou':'desativou'} o usuário ${u.nome}.`);
      saveDataToFirebase();
      render();
    });
    document.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>{
      const u = state.usuarios.find(x=>x.id===+b.dataset.deluser);
      if(!confirm(`Excluir o usuário ${u.nome}?`)) return;
      state.usuarios = state.usuarios.filter(x=>x.id!==u.id);
      logAudit(`${state.loggedUser.nome} excluiu o usuário ${u.nome}.`);
      saveDataToFirebase();
      render();
    });
  }
}

// ================== IMPORTAR/EXPORTAR EXCEL ==================
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];
    let json = XLSX.utils.sheet_to_json(worksheet, {header:1, defval:''});
    if(!json.length) return alert('A planilha está vazia.');

    let headerRowIndex = -1;
    let bestMapping = {};

    for(let r=0; r<Math.min(json.length, 15); r++){
      const row = json[r];
      let mapping = {};
      let hits = 0;
      row.forEach((cell, c)=>{
        const key = normKey(cell);
        if(COLUMN_MAP[key]){
          mapping[c] = COLUMN_MAP[key];
          hits++;
        }
      });
      if(hits >= 2 && hits > Object.keys(bestMapping).length) { 
        headerRowIndex = r;
        bestMapping = mapping;
      }
    }

    if(headerRowIndex === -1){
      return alert('Não consegui identificar os cabeçalhos. Certifique-se de que a planilha tem colunas como "Nome", "Matrícula", etc.');
    }

    let problems = [];
    importState = {rows: json, headerRowIndex, mapping: bestMapping, problems, ready:[]};

    for(let r=headerRowIndex+1; r<json.length; r++){
      const row = json[r];
      let isEmpty = true;
      row.forEach(cell => { if(cell && cell.toString().trim() !== '') isEmpty = false; });
      if(isEmpty) continue;

      let colabData = {status: 'Ativo'};
      Object.keys(bestMapping).forEach(colIdx => {
        const fieldName = bestMapping[colIdx];
        colabData[fieldName] = row[colIdx];
      });

      if(!colabData.nome || !colabData.nome.toString().trim()) {
        problems.push(`Linha ${r+1}: Nome em branco. Ignorada.`);
        continue;
      }
      colabData.nome = colabData.nome.toString().trim();
      if(colabData.matricula) colabData.matricula = colabData.matricula.toString().trim();
      if(colabData.admissao) colabData.admissao = excelDateToISO(colabData.admissao);

      if(colabData.matricula && state.colaboradores.some(c=>c.matricula===colabData.matricula)) {
        problems.push(`Linha ${r+1}: Matrícula ${colabData.matricula} já existe. Ignorada.`);
        continue;
      }

      importState.ready.push(colabData);
    }
    renderImportPreview();
  };
  reader.readAsArrayBuffer(file);
}

function renderImportPreview(){
  const div = document.getElementById('importPreview');
  if(!importState || !importState.ready) return;
  div.innerHTML = `
    <div class="ok-box"><b>${importState.ready.length} colaboradores</b> encontrados e prontos para importar.</div>
    ${importState.problems.length > 0 ? `<div class="problem-box"><b>Avisos:</b><br>${importState.problems.slice(0,10).join('<br>')}${importState.problems.length>10?'<br>...':''}</div>` : ''}
    <button style="margin-top:16px" id="doImportBtn">Confirmar Importação</button>
  `;
  document.getElementById('doImportBtn').onclick = ()=>{
    importState.ready.forEach(d => {
      state.colaboradores.unshift({id: state.nextColabId++, ...d});
    });
    logAudit(`${state.loggedUser.nome} importou ${importState.ready.length} colaboradores do Excel.`);
    saveDataToFirebase();
    alert('Importação concluída e salva no banco de dados!');
    importState = null;
    currentTab = 'colaboradores';
    render();
  };
}

// === EXPORTAÇÕES EXCEL ===
function exportToExcel(dataArray, filename){
  if(!dataArray || !dataArray.length) return alert('Não há dados para exportar.');
  const worksheet = XLSX.utils.json_to_sheet(dataArray);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Planilha1");
  XLSX.writeFile(workbook, filename);
}

function exportColaboradores(){
  const exportData = state.colaboradores.map(c=>({
    'ID': c.id,
    'Nome': c.nome,
    'Matrícula': c.matricula||'',
    'CPF': c.cpf||'',
    'Cargo': c.cargo||'',
    'Departamento': c.depto||'',
    'Setor': c.setor||'',
    'Admissão': fmtDate(c.admissao),
    'Status': c.status
  }));
  exportToExcel(exportData, `Colaboradores_${todayISO()}.xlsx`);
}

function exportHistorico(){
  const exportData = state.historico.map(h=>{
    const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
    return {
      'Nome': c?.nome||'(excluído)',
      'Tipo': h.tipo,
      'Início': fmtDate(h.inicio),
      'Fim': fmtDate(h.fim),
      'Dias': h.dias,
      'Observação': h.obs||''
    };
  });
  exportToExcel(exportData, `Historico_Ocorrencias_${todayISO()}.xlsx`);
}

function exportPresenca(){
  const exportData = [];
  Object.keys(state.registros).forEach(k=>{
    const [cid, data] = k.split('|');
    const c = state.colaboradores.find(x=>x.id===+cid);
    if(!c) return; 
    exportData.push({
      'Nome': c.nome,
      'Matrícula': c.matricula||'',
      'Data': fmtDate(data),
      'Data_ISO': data, 
      'Situação': state.registros[k].tipo,
      'Observação': state.registros[k].obs||''
    });
  });
  exportData.sort((a,b)=> a.Data_ISO.localeCompare(b.Data_ISO) || a.Nome.localeCompare(b.Nome));
  exportData.forEach(d=> delete d.Data_ISO); 
  exportToExcel(exportData, `Presencas_Diarias_${todayISO()}.xlsx`);
}

// ================== LOGIN ==================
function renderLogin(){
  const msg = loginMode==='login'
    ? '<b>Acesso ao sistema em nuvem</b><br>As credenciais iniciais são:<br>E-mail: <b>admin@empresa.com</b><br>Senha: <b>admin123</b>'
    : '<b>Recuperação de senha</b><br>Acesse o painel do Firebase para redefinir credenciais.';
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h1 style="color:#102a56;margin:0 0 10px;text-align:center">Presença<span style="color:#3b82f6">·RH</span></h1>
        <div class="hint" style="text-align:center;margin-bottom:24px">${msg}</div>
        ${loginMode==='login' ? `
          <div class="field"><label>E-mail</label><input id="l_email" value="admin@empresa.com"></div>
          <div class="field"><label>Senha</label><input type="password" id="l_senha" value="admin123"></div>
          <button id="l_btn">Entrar no sistema</button>
          <div class="login-links"><a id="l_esqueci">Esqueci a senha</a></div>
        ` : `
          <div class="field"><label>E-mail cadastrado</label><input id="l_email"></div>
          <button id="l_btn">Enviar instruções</button>
          <div class="login-links"><a id="l_voltar">Voltar ao login</a></div>
        `}
      </div>
    </div>
  `;
  if(loginMode==='login'){
    document.getElementById('l_btn').onclick = ()=>{
      const e = document.getElementById('l_email').value;
      const s = document.getElementById('l_senha').value;
      const u = state.usuarios.find(x=>x.email===e && x.senha===s);
      if(u){
        if(!u.ativo) return alert('Usuário desativado.');
        state.loggedUser = u;
        logAudit(`Login efetuado: ${u.nome}.`);
        // Aqui nós intencionalmente não salvamos no Firebase para que 
        // a sessão do usuário não fique presa no banco de dados na nuvem para outras pessoas.
        render();
      } else {
        alert('Credenciais inválidas.');
      }
    };
    document.getElementById('l_esqueci').onclick = ()=>{ loginMode='esqueci'; render(); };
  } else {
    document.getElementById('l_btn').onclick = ()=>alert('Procure a guia de Authentication dentro do site do Firebase para recuperar usuários.');
    document.getElementById('l_voltar').onclick = ()=>{ loginMode='login'; render(); };
  }
}
