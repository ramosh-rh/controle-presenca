<script>
// ================== ESTADO EM MEMÓRIA ==================
// Os dados existem apenas enquanto esta aba estiver aberta (sem localStorage).
// Recarregar a página reinicia para o estado de demonstração.

const TIPOS = {
  'Presença': {cor:'#1e4d8b', conta:'presenca'},
  'Falta': {cor:'#c0392b', conta:'ausencia'},
  'Saída antecipada': {cor:'#8a5a3b', conta:'presenca'},
  'Férias': {cor:'#2e7bbf', conta:'afastamento'},
  'Atestado': {cor:'#7a3b8a', conta:'afastamento'},
  'Declaração': {cor:'#a67b1e', conta:'afastamento'},
  'Licença-maternidade': {cor:'#b0396f', conta:'afastamento'},
  'Suspensão': {cor:'#555555', conta:'afastamento'},
};

let state = {
  usuarios: [
    {id:1, nome:'Administrador', email:'admin@empresa.com', senha:'admin123', nivel:'Administrador', ativo:true}
  ],
  loggedUser: null,
  colaboradores: [
    {id:1, nome:'João Silva', matricula:'0001', cpf:'111.111.111-11', cargo:'Analista', depto:'RH', admissao:'2023-02-01', status:'Ativo'},
    {id:2, nome:'Maria Souza', matricula:'0002', cpf:'222.222.222-22', cargo:'Assistente', depto:'Financeiro', admissao:'2022-06-15', status:'Ativo'},
    {id:3, nome:'Carlos Lima', matricula:'0003', cpf:'333.333.333-33', cargo:'Coordenador', depto:'Operações', admissao:'2021-01-10', status:'Ativo'},
    {id:4, nome:'Ana Santos', matricula:'0004', cpf:'444.444.444-44', cargo:'Estagiária', depto:'Marketing', admissao:'2024-03-20', status:'Ativo'},
  ],
  registros: {}, // chave: colaboradorId|YYYY-MM-DD -> {tipo, obs}
  historico: [], // {id, colaboradorId, tipo, inicio, fim, obs, dias}
  auditoria: [],
  nextColabId: 5,
  nextUserId: 2,
  nextHistId: 1,
};

function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function logAudit(msg){ state.auditoria.unshift({msg, ts:new Date().toLocaleString('pt-BR')}); }

function applyPeriodo(colaboradorId, tipo, inicio, fim, obs, hora=''){
  let cur = inicio;
  while(cur <= fim){
    state.registros[colaboradorId+'|'+cur] = {tipo, obs: obs||'', hora: hora||''};
    cur = addDays(cur,1);
  }
  state.historico.unshift({id: state.nextHistId++, colaboradorId, tipo, inicio, fim, obs: obs||'', dias: diffDays(inicio,fim)+1});
  const colab = state.colaboradores.find(c=>c.id===colaboradorId);
  logAudit(`${state.loggedUser?.nome||'Sistema'} lançou "${tipo}" para ${colab?.nome} de ${fmtDate(inicio)} a ${fmtDate(fim)}.`);
}

function formatHora(h){return h||'—';}
function excluirRegistrosDoPeriodo(hist){
  let cur = hist.inicio;
  while(cur <= hist.fim){
    const key = hist.colaboradorId+'|'+cur;
    if(state.registros[key] && state.registros[key].tipo === hist.tipo) delete state.registros[key];
    cur = addDays(cur,1);
  }
}

// ================== NORMALIZAÇÃO DE TEXTO (p/ importação) ==================
function normKey(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
// mapa de possíveis nomes de coluna (normalizados) -> campo interno
const COLUMN_MAP = {
  'nome':'nome', 'nome completo':'nome', 'colaborador':'nome', 'funcionario':'nome',
  'matricula':'matricula', 'matricula ':'matricula', 'registro':'matricula',
  'cpf':'cpf',
  'cargo':'cargo', 'funcao':'cargo',
  'depto':'depto', 'departamento':'depto', 'setor':'depto',
  'admissao':'admissao', 'data de admissao':'admissao', 'dt admissao':'admissao',
  'status':'status',
  'filial':'filial',
};

function excelDateToISO(v){
  if(v===''||v==null) return '';
  if(typeof v === 'number'){
    // número serial do Excel
    const d = XLSX.SSF.parse_date_code(v);
    if(!d) return '';
    return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = v.toString().trim();
  // dd/mm/aaaa
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // já em aaaa-mm-dd
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}

// ================== RENDERIZAÇÃO ==================
const root = document.getElementById('root');
let currentTab = 'dashboard';
let loginMode = 'login';
let modal = null;
let filterDate = todayISO();
let searchTerm = '';
let relInicio = todayISO();
let relFim = todayISO();
let relColabId = 'todos';
let importState = null; // {rows, headerRowIndex, mapping, problems, ready}
let colabSetor='todos',colabStatus='todos',presencaBusca='',presencaSetor='todos',presencaStatus='todos',presencaSituacao='todos',relSetor='todos',relTipo='todos';
function byName(a,b){return normKey(a.nome||'').localeCompare(normKey(b.nome||''),'pt-BR',{sensitivity:'base'});}
function setores(){return [...new Set(state.colaboradores.map(c=>c.setor).filter(Boolean))].sort((a,b)=>normKey(a).localeCompare(normKey(b),'pt-BR'));}
function situacaoDo(c,d){return state.registros[c.id+'|'+d]?.tipo||'';}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function removeModalNodes(){
  // O modal é anexado diretamente ao <body> (fora da #root); se não for removido
  // explicitamente antes de re-renderizar, ele se acumula no DOM a cada clique
  // em "Cancelar"/"Salvar" e o Chrome passa a se confundir em páginas file://.
  document.querySelectorAll('.modal-bg').forEach(el=>el.remove());
}

function render(){
  removeModalNodes();
  if(!state.loggedUser){ renderLogin(); return; }
  root.innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="brand">Presença<span>·RH</span></div>
        ${navItem('dashboard','Dashboard')}
        ${navItem('colaboradores','Colaboradores')}
        ${navItem('presenca','Controle Diário')}
        ${navItem('relatorios','Relatórios')}
        ${navItem('importexport','Importar / Exportar')}
        ${navItem('usuarios','Usuários')}
        ${navItem('auditoria','Auditoria')}
        <div style="margin:22px 12px 0;padding:13px 12px;border:1px solid rgba(147,197,253,.16);border-radius:13px;background:rgba(255,255,255,.06);font-size:.72rem;color:#bfdbfe;line-height:1.45"><span class="pulse"></span>Sistema operacional<br><b style="color:#fff">Monitoramento ativo</b></div>
      </div>
      <div class="main" id="main"></div>
    </div>
  `;
  document.querySelectorAll('.nav-item').forEach(el=>{ el.onclick = ()=>{ currentTab = el.dataset.tab; modal=null; render(); }; });
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="top-actions">
      <div></div>
      <div class="userbar"><b>${state.loggedUser.nome}</b> (${state.loggedUser.nivel}) <a id="logout">Sair</a></div>
    </div>
  ` + tabContent();
  document.getElementById('logout').onclick = ()=>{ state.loggedUser=null; render(); };
  bindTabEvents();
  if(modal) renderModal();
}
function navItem(tab,label){ return `<div class="nav-item ${currentTab===tab?'active':''}" data-tab="${tab}">${label}</div>`; }

function tabContent(){
  if(currentTab==='dashboard') return renderDashboard();
  if(currentTab==='colaboradores') return renderColaboradores();
  if(currentTab==='presenca') return renderPresenca();
  if(currentTab==='relatorios') return renderRelatorios();
  if(currentTab==='importexport') return renderImportExport();
  if(currentTab==='usuarios') return renderUsuarios();
  if(currentTab==='auditoria') return renderAuditoria();
  return '';
}

// ---- Dashboard ----
function renderDashboard(){
  const ativos = state.colaboradores.filter(c=>c.status!=='Demitido');
  const today = todayISO();
  let presentes=0, faltas=0, ferias=0, atestado=0, suspensao=0, saidaAnt=0;
  ativos.forEach(c=>{
    const r = state.registros[c.id+'|'+today];
    if(r){
      if(r.tipo==='Presença') presentes++;
      else if(r.tipo==='Falta') faltas++;
      else if(r.tipo==='Férias') ferias++;
      else if(r.tipo==='Atestado') atestado++;
      else if(r.tipo==='Suspensão') suspensao++;
      else if(r.tipo==='Saída antecipada') saidaAnt++;
    }
  });
  const abs=ativos.map(c=>({c,faltas:Object.keys(state.registros).filter(k=>k.startsWith(c.id+'|')&&state.registros[k].tipo==='Falta').length})).sort((a,b)=>b.faltas-a.faltas||byName(a.c,b.c));
  const maiorAbs=abs[0];
  const taxa = ativos.length ? Math.round((presentes / ativos.length) * 100) : 0;
  return `
    <div class="page-hero"><div><h1>Bom trabalho, ${state.loggedUser?.nome?.split(' ')[0] || 'equipe'}!</h1><div class="hero-note"><span class="pulse"></span>Painel atualizado para ${fmtDate(today)}. Acompanhe a rotina da equipe em um só lugar.</div></div><button id="heroPresence">Abrir controle diário</button></div>
    <div class="cards">
      ${stat(ativos.length,'Funcionários ativos')}
      ${stat(presentes,'Presentes hoje')}
      ${stat(faltas,'Faltas hoje')}
      ${stat(ferias,'De férias')}
      ${stat(atestado,'Com atestado')}
      ${stat(suspensao,'Suspensos')}
      ${stat(saidaAnt,'Saída antecipada')}
    </div>
    <div class="insight-grid"><div class="insight-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>Taxa de presença hoje</b><strong style="color:#0f9d8a;font-size:1.35rem">${taxa}%</strong></div><div class="progress"><i style="width:${taxa}%"></i></div><small style="color:var(--muted)">${presentes} de ${ativos.length} colaborador(es) ativo(s) com presença lançada.</small></div><div class="insight-card"><b>Maior absenteísmo</b><div style="font-size:1.1rem;font-weight:800;color:#b91c1c;margin-top:10px">${maiorAbs?.c.nome||'Nenhum registro'}</div><small style="color:var(--muted)">${maiorAbs?.faltas||0} falta(s) registrada(s) no histórico</small></div><div class="insight-card"><b>Atalhos rápidos</b><div class="btnrow" style="margin-top:14px"><button class="secondary" id="heroColab">+ Colaborador</button><button class="secondary" id="heroReport">Ver relatórios</button></div></div></div>
    <h2 style="font-size:1.1rem;">Últimos lançamentos de período</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Dias</th><th>Obs.</th></tr>
      ${state.historico.slice(0,8).map(h=>{
        const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
        return `<tr><td>${c?.nome||'—'}</td><td>${tipoBadge(h.tipo)}</td><td>${fmtDate(h.inicio)}</td><td>${fmtDate(h.fim)}</td><td>${h.dias}</td><td>${h.obs||'—'}</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="empty-state">Nenhum lançamento ainda. Os novos registros aparecerão aqui.</td></tr>'}
    </table></div>
  `;
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
function tipoBadge(tipo){ const cor = TIPOS[tipo]?.cor || '#777'; return `<span class="badge" style="background:${cor}">${tipo}</span>`; }
function statusBadge(status){
  const cores = {'Ativo':'#1e4d8b','Férias':'#2e7bbf','Afastado':'#7a3b8a','Suspenso':'#555','Demitido':'#c0392b'};
  return `<span class="badge" style="background:${cores[status]||'#777'}">${status}</span>`;
}

}

// ---- Presença ----
function renderPresenca(){
  const ativos=state.colaboradores.filter(c=>c.status!=='Demitido'&&(presencaBusca===''||normKey(c.nome).includes(normKey(presencaBusca))||normKey(c.matricula||'').includes(normKey(presencaBusca)))&&(presencaSetor==='todos'||c.setor===presencaSetor)&&(presencaStatus==='todos'||c.status===presencaStatus)&&(presencaSituacao==='todos'||situacaoDo(c,filterDate)===presencaSituacao)).sort(byName);

}

// ---- Relatórios (com busca por período) ----
function renderRelatorios(){
  const inRange = state.historico.filter(h=>{
    const hc=state.colaboradores.find(x=>x.id===h.colaboradorId); if(relColabId!=='todos' && h.colaboradorId!==+relColabId) return false; if(relSetor!=='todos'&&hc?.setor!==relSetor)return false; if(relTipo!=='todos'&&h.tipo!==relTipo)return false;
    // interseção de período
    return h.inicio <= relFim && h.fim >= relInicio;
  });

  // presenças diárias avulsas (marcadas manualmente) dentro do período
  const diarios = [];
  Object.keys(state.registros).forEach(key=>{
    const [cid, data] = key.split('|');
    if(data < relInicio || data > relFim) return;
    const rc=state.colaboradores.find(x=>x.id===+cid); if(relColabId!=='todos' && +cid !== +relColabId) return; if(relSetor!=='todos'&&rc?.setor!==relSetor)return; if(relTipo!=='todos'&&state.registros[key].tipo!==relTipo)return;
    diarios.push({colaboradorId:+cid, data, ...state.registros[key]});
  });
  diarios.sort((a,b)=>a.data.localeCompare(b.data));

  return `
    <h1>Relatórios</h1>
    <div class="sub">Consulte tudo o que já foi salvo — lançamentos de período e marcações diárias</div>
    <div class="toolbar">
      <div class="fgroup"><label>Colaborador</label>
        <select id="rel_colab">
          <option value="todos" ${relColabId==='todos'?'selected':''}>Todos</option>
          ${state.colaboradores.map(c=>`<option value="${c.id}" ${relColabId==(''+c.id)?'selected':''}>${c.nome}</option>`).join('')}
        </select>
      </div>
      <div class="fgroup"><label>De</label><input type="date" id="rel_inicio" value="${relInicio}"></div>
      <div class="fgroup"><label>Até</label><input type="date" id="rel_fim" value="${relFim}"></div><div class="fgroup"><label>Setor</label><select id="rel_setor"><option value="todos">Todos</option>${setores().map(x=>`<option value="${esc(x)}" ${relSetor===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fgroup"><label>Tipo</label><select id="rel_tipo"><option value="todos">Todos</option>${Object.keys(TIPOS).map(x=>`<option ${relTipo===x?'selected':''}>${x}</option>`).join('')}</select></div><button id="rel_buscar">Buscar</button>
    </div>

    <h2 style="font-size:1.05rem;">Períodos lançados (férias, atestado, suspensão etc.)</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Dias</th><th>Obs.</th><th>Ações</th></tr>
      ${inRange.map(h=>{
        const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
        return `<tr><td>${c?.nome||'(excluído)'}</td><td>${tipoBadge(h.tipo)}</td><td>${fmtDate(h.inicio)}</td><td>${fmtDate(h.fim)}</td><td>${h.dias}</td><td>${h.obs||'—'}</td>
          <td><button class="danger" data-delhist="${h.id}">Excluir</button></td></tr>`;
      }).join('') || '<tr><td colspan="7">Nenhum período no intervalo selecionado.</td></tr>'}
    </table></div>

    <h2 style="font-size:1.05rem;margin-top:22px;">Marcações diárias no período</h2>
    <div class="table-scroll"><table>
      <tr><th>Colaborador</th><th>Data</th><th>Situação</th><th>Horário</th><th>Observação</th><th>Ações</th></tr>
      ${diarios.map(d=>{
        const c = state.colaboradores.find(x=>x.id===d.colaboradorId);
        return `<tr><td>${c?.nome||'(excluído)'}</td><td>${fmtDate(d.data)}</td><td>${tipoBadge(d.tipo)}</td><td>${formatHora(d.hora)}</td><td>${d.obs||'—'}</td>
          <td><button class="danger" data-delreg="${d.colaboradorId}|${d.data}">Excluir</button></td></tr>`;
      }).join('') || '<tr><td colspan="6">Nenhuma marcação diária no intervalo selecionado.</td></tr>'}
    </table></div>
  `;
}

// ================== EVENTOS POR ABA ==================
function bindTabEvents(){
  if(currentTab==='dashboard'){
    document.getElementById('heroPresence')?.addEventListener('click',()=>{ currentTab='presenca'; render(); });
    document.getElementById('heroColab')?.addEventListener('click',()=>{ currentTab='colaboradores'; modal={type:'colab'}; render(); });
    document.getElementById('heroReport')?.addEventListener('click',()=>{ currentTab='relatorios'; render(); });
  }
  if(currentTab==='colaboradores'){
    document.getElementById('searchColab').oninput = e=>{ searchTerm=e.target.value; render(); const inp=document.getElementById('searchColab'); inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; };
    document.getElementById('novoColab').onclick = ()=>{ modal={type:'colab'}; render(); }; document.getElementById('colabSetor').onchange=e=>{colabSetor=e.target.value;render();}; document.getElementById('colabStatus').onchange=e=>{colabStatus=e.target.value;render();};
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ modal={type:'colab', id:+b.dataset.edit}; render(); });
    document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{ modal={type:'hist', id:+b.dataset.hist}; render(); });
    document.querySelectorAll('[data-fire]').forEach(b=>b.onclick=()=>{
      const c = state.colaboradores.find(x=>x.id===+b.dataset.fire);
      c.status='Demitido';
      logAudit(`${state.loggedUser.nome} desligou ${c.nome}.`);
      render();
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      const c = state.colaboradores.find(x=>x.id===+b.dataset.del);
      if(!confirm(`Excluir definitivamente ${c.nome}? Isso também remove seu histórico e marcações.`)) return;
      state.colaboradores = state.colaboradores.filter(x=>x.id!==c.id);
      state.historico = state.historico.filter(h=>h.colaboradorId!==c.id);
      Object.keys(state.registros).forEach(k=>{ if(k.startsWith(c.id+'|')) delete state.registros[k]; });
      logAudit(`${state.loggedUser.nome} excluiu o colaborador ${c.nome}.`);
      render();
    });
  }
  if(currentTab==='presenca'){
    document.getElementById('filterDate').onchange=e=>{filterDate=e.target.value;render();}; document.getElementById('presencaBusca').oninput=e=>{presencaBusca=e.target.value;render();const x=document.getElementById('presencaBusca');x.focus();x.selectionStart=x.selectionEnd=x.value.length;}; document.getElementById('presencaSetor').onchange=e=>{presencaSetor=e.target.value;render();}; document.getElementById('presencaStatus').onchange=e=>{presencaStatus=e.target.value;render();}; document.getElementById('presencaSituacao').onchange=e=>{presencaSituacao=e.target.value;render();};
    document.getElementById('lancarPeriodo').onclick = ()=>{ modal={type:'periodo'}; render(); };
    document.querySelectorAll('[data-quick]').forEach(sel=>{
      sel.onchange = ()=>{
        if(!sel.value) return;
        const cid = +sel.dataset.quick;
        if(sel.value==='Saída antecipada'){modal={type:'saida',cid};render();return;} state.registros[cid+'|'+filterDate]={tipo:sel.value,obs:'',hora:''};
        const c = state.colaboradores.find(x=>x.id===cid);
        logAudit(`${state.loggedUser.nome} marcou ${c.nome} como "${sel.value}" em ${fmtDate(filterDate)}.`);
        // Atualiza só a linha afetada, sem recriar todos os <select> da tabela
        // (recriar todos os selects em massa é o que provoca o travamento no Chrome local).
        const statusCell = document.getElementById('status-quick-'+cid);
        const obsCell = document.getElementById('obs-quick-'+cid);
        if(statusCell) statusCell.innerHTML = tipoBadge(sel.value);
        if(obsCell) obsCell.innerHTML='—'; const horaCell=document.getElementById('hora-quick-'+cid); if(horaCell) horaCell.innerHTML='—';
      };
    });
  }
  if(currentTab==='relatorios'){
    document.getElementById('rel_buscar').onclick = ()=>{
      relColabId = document.getElementById('rel_colab').value;
      relInicio = document.getElementById('rel_inicio').value;
      relFim = document.getElementById('rel_fim').value; relSetor=document.getElementById('rel_setor').value; relTipo=document.getElementById('rel_tipo').value;
      render();
    };
    document.querySelectorAll('[data-delhist]').forEach(b=>b.onclick=()=>{
      const id = +b.dataset.delhist;
      const h = state.historico.find(x=>x.id===id);
      if(!h) return;
      if(!confirm('Excluir este período lançado? As marcações diárias correspondentes também serão removidas.')) return;
      excluirRegistrosDoPeriodo(h);
      state.historico = state.historico.filter(x=>x.id!==id);
      logAudit(`${state.loggedUser.nome} excluiu o lançamento "${h.tipo}" (${fmtDate(h.inicio)}–${fmtDate(h.fim)}).`);
      render();
    });
    document.querySelectorAll('[data-delreg]').forEach(b=>b.onclick=()=>{
      const [cid,data] = b.dataset.delreg.split('|');
      if(!confirm('Excluir esta marcação diária?')) return;
      delete state.registros[cid+'|'+data];
      logAudit(`${state.loggedUser.nome} excluiu a marcação de ${fmtDate(data)}.`);
      render();
    });
  }
  if(currentTab==='importexport'){
    document.getElementById('fileImport').onchange = handleImportFile;
    document.getElementById('exportColab').onclick = exportColaboradores;
    document.getElementById('exportHist').onclick = exportHistorico;
    document.getElementById('exportPresenca').onclick = exportPresenca;
  }
  if(currentTab==='usuarios'){
    document.getElementById('novoUsuario').onclick = ()=>{ modal={type:'usuario'}; render(); };
    document.querySelectorAll('[data-toggleuser]').forEach(b=>b.onclick=()=>{
      const u = state.usuarios.find(x=>x.id===+b.dataset.toggleuser);
      u.ativo=!u.ativo;
      logAudit(`${state.loggedUser.nome} ${u.ativo?'ativou':'desativou'} usuário ${u.nome}.`);
      render();
    });
    document.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>{
      const u = state.usuarios.find(x=>x.id===+b.dataset.deluser);
      if(!confirm(`Excluir usuário ${u.nome}?`)) return;
      state.usuarios = state.usuarios.filter(x=>x.id!==u.id);
      logAudit(`${state.loggedUser.nome} excluiu o usuário ${u.nome}.`);
      render();
    });
  }
}

// ================== MODAIS ==================
function renderModal(){

  if(modal.type==='colab') html = colabModal();

function bindModalEvents(wrap){
  wrap.querySelector('#cancelModal')?.addEventListener('click', ()=>{ modal=null; render(); });

  wrap.querySelector('#saveColab')?.addEventListener('click', ()=>{
    const nome = wrap.querySelector('#f_nome').value.trim();
    if(!nome){ alert('Informe o nome.'); return; }
    if(modal.id){
      const c = state.colaboradores.find(x=>x.id===modal.id);
      Object.assign(c, {
        nome, matricula:wrap.querySelector('#f_matricula').value,
        cpf:wrap.querySelector('#f_cpf').value, cargo:wrap.querySelector('#f_cargo').value,
        depto:wrap.querySelector('#f_depto').value, setor:wrap.querySelector('#f_setor').value,
        admissao:wrap.querySelector('#f_admissao').value,
      });
      logAudit(`${state.loggedUser.nome} editou o cadastro de ${nome}.`);
    } else {
      const novo = {
        id: state.nextColabId++, nome,
        matricula:wrap.querySelector('#f_matricula').value || String(state.nextColabId).padStart(4,'0'),
        cpf:wrap.querySelector('#f_cpf').value, cargo:wrap.querySelector('#f_cargo').value,
        depto:wrap.querySelector('#f_depto').value, setor:wrap.querySelector('#f_setor').value,
        admissao:wrap.querySelector('#f_admissao').value,
        status:'Ativo'
      };
      state.colaboradores.push(novo);
      logAudit(`${state.loggedUser.nome} cadastrou o colaborador ${nome}.`);
    }
    modal=null; render();
  });

  wrap.querySelectorAll('[data-delhistmodal]').forEach(b=>b.addEventListener('click', ()=>{
    const id = +b.dataset.delhistmodal;
    const h = state.historico.find(x=>x.id===id);
    if(!h) return;
    if(!confirm('Excluir este período? As marcações diárias correspondentes também serão removidas.')) return;
    excluirRegistrosDoPeriodo(h);
    state.historico = state.historico.filter(x=>x.id!==id);
    logAudit(`${state.loggedUser.nome} excluiu o lançamento "${h.tipo}".`);
    render();
  }));

  const modoSel = wrap.querySelector('#p_modo');
  modoSel?.addEventListener('change', ()=>{
    wrap.querySelector('#p_diasField').style.display = modoSel.value==='dias'?'block':'none';
    wrap.querySelector('#p_fimField').style.display = modoSel.value==='fim'?'block':'none';
  });

  wrap.querySelector('#savePeriodo')?.addEventListener('click', ()=>{
    const cid = +wrap.querySelector('#p_colab').value;
    const tipo = wrap.querySelector('#p_tipo').value;
    const inicio = wrap.querySelector('#p_inicio').value;
    const obs = wrap.querySelector('#p_obs').value;
    let fim;
    if(modoSel.value==='dias'){
      const dias = parseInt(wrap.querySelector('#p_dias').value,10) || 1;
      fim = addDays(inicio, dias-1);
    } else {
      fim = wrap.querySelector('#p_fim').value;
    }
    if(!inicio || !fim){ alert('Informe as datas corretamente.'); return; }
    if(fim < inicio){ alert('A data final não pode ser anterior à data inicial.'); return; }
    applyPeriodo(cid, tipo, inicio, fim, obs);
    const c = state.colaboradores.find(x=>x.id===cid);
    if(TIPOS[tipo].conta==='afastamento') c.status = tipo==='Férias'?'Férias': tipo==='Suspensão'?'Suspenso':'Afastado';
    modal=null; render();
  });

  wrap.querySelector('#saveSaida')?.addEventListener('click',()=>{const hora=wrap.querySelector('#s_hora').value;if(!hora){alert('Informe o horário da saída.');return;}const cid=modal.cid,obs=wrap.querySelector('#s_obs').value;state.registros[cid+'|'+filterDate]={tipo:'Saída antecipada',obs,hora};const c=state.colaboradores.find(x=>x.id===cid);logAudit(`${state.loggedUser.nome} marcou saída antecipada de ${c.nome} às ${hora} em ${fmtDate(filterDate)}.`);modal=null;render();});

  wrap.querySelector('#saveUsuario')?.addEventListener('click', ()=>{
    const nome = wrap.querySelector('#u_nome').value.trim();
    const email = wrap.querySelector('#u_email').value.trim();
    if(!nome || !email){ alert('Preencha nome e e-mail.'); return; }
    if(state.usuarios.some(u=>u.email===email)){ alert('Já existe um usuário com este e-mail.'); return; }
    state.usuarios.push({id:state.nextUserId++, nome, email, senha:wrap.querySelector('#u_senha').value||'123456', nivel:wrap.querySelector('#u_nivel').value, ativo:true});
    logAudit(`${state.loggedUser.nome} criou o usuário ${nome} (${wrap.querySelector('#u_nivel').value}).`);
    modal=null; render();
  });
}

// ================== IMPORTAR / EXPORTAR EXCEL ==================
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('importPreview');
  preview.innerHTML = '<p class="hint">Lendo planilha...</p>';
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, {type:'binary', cellDates:false});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      // pega a matriz bruta (sem assumir que a linha 1 é o cabeçalho)
      const matrix = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});

      // localizar a linha de cabeçalho: primeira linha que tenha ao menos 2 colunas reconhecidas
      let headerRowIdx = -1, mapping = {};
      for(let i=0;i<Math.min(matrix.length,15);i++){
        const row = matrix[i];
        const map = {};
        let hits = 0;
        row.forEach((cell, colIdx)=>{
          const key = COLUMN_MAP[normKey(cell)];
          if(key){ map[key]=colIdx; hits++; }
        });
        if(hits>=2){ headerRowIdx=i; mapping=map; break; }
      }

      if(headerRowIdx===-1){
        preview.innerHTML = `<div class="problem-box"><b>Não foi possível identificar o cabeçalho da planilha.</b><br>Verifique se existe uma linha com colunas como "Nome", "Matrícula", "Departamento" etc.</div>`;
        return;
      }
      if(!('nome' in mapping)){
        preview.innerHTML = `<div class="problem-box"><b>A planilha não tem uma coluna de nome reconhecida.</b><br>Renomeie a coluna para "Nome" e tente novamente.</div>`;
        return;
      }

      const problemas = [];
      let importados = 0;
      for(let i=headerRowIdx+1; i<matrix.length; i++){
        const row = matrix[i];
        if(!row || row.every(c=>c===''||c==null)) continue; // linha totalmente vazia, ignora silenciosamente
        const get = (field)=> mapping[field]!==undefined ? row[mapping[field]] : '';
        const nome = (get('nome')||'').toString().trim();
        if(!nome) continue; // linha sem nome (ex: linhas de rodapé) — ignorada sem contar como erro
        const matriculaRaw = (get('matricula')||'').toString().trim();
        const cpf = (get('cpf')||'').toString().trim();
        if(matriculaRaw && state.colaboradores.some(c=>c.matricula===matriculaRaw)){
          problemas.push(`Linha ${i+1}: matrícula "${matriculaRaw}" já cadastrada (${nome}).`); continue;
        }
        if(cpf && state.colaboradores.some(c=>c.cpf===cpf)){
          problemas.push(`Linha ${i+1}: CPF "${cpf}" duplicado (${nome}).`); continue;
        }
        if(state.colaboradores.some(c=>normKey(c.nome)===normKey(nome) && !matriculaRaw)){
          problemas.push(`Linha ${i+1}: colaborador "${nome}" já parece estar cadastrado.`); continue;
        }
        state.colaboradores.push({
          id: state.nextColabId++,
          nome,
          matricula: matriculaRaw || String(state.nextColabId).padStart(4,'0'),
          cpf,
          cargo:(get('cargo')||'').toString(),
          depto:(get('depto')||'').toString(),
          admissao: excelDateToISO(get('admissao')),
          status: (get('status')||'Ativo').toString() || 'Ativo'
        });
        importados++;
      }

      logAudit(`${state.loggedUser.nome} importou planilha: ${importados} colaborador(es) adicionados, ${problemas.length} problema(s).`);
      preview.innerHTML = `
        <div class="ok-box"><b>${importados} colaborador(es) importado(s) com sucesso.</b></div>
        ${problemas.length? `<div class="problem-box"><b>${problemas.length} linha(s) ignorada(s):</b><br>${problemas.slice(0,50).join('<br>')}${problemas.length>50?'<br>...':''}</div>`:''}
      `;
      if(importados>0) render();
    } catch(err){
      preview.innerHTML = `<div class="problem-box"><b>Erro ao ler o arquivo.</b><br>${err.message}</div>`;
    } finally {
      e.target.value = '';
    }
  };
  reader.onerror = ()=>{ preview.innerHTML = '<div class="problem-box">Não foi possível ler o arquivo.</div>'; };
  reader.readAsBinaryString(file);
}

function downloadWorkbook(wb, filename){
  try{
    XLSX.writeFile(wb, filename);
  }catch(err){
    // fallback manual, útil em alguns navegadores/contextos de arquivo local
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
}

function exportColaboradores(){
  const data = state.colaboradores.map(c=>({
    Nome:c.nome, Matricula:c.matricula, CPF:c.cpf, Cargo:c.cargo, Departamento:c.depto, Admissao:c.admissao, Status:c.status
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Colaboradores');
  downloadWorkbook(wb, 'colaboradores.xlsx');
  logAudit(`${state.loggedUser.nome} exportou a lista de colaboradores.`);
}
function exportHistorico(){
  const data = state.historico.map(h=>{
    const c = state.colaboradores.find(x=>x.id===h.colaboradorId);
    return {Colaborador:c?.nome||'', Tipo:h.tipo, Inicio:h.inicio, Fim:h.fim, Dias:h.dias, Observacao:h.obs};
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Historico');
  downloadWorkbook(wb, 'historico_ocorrencias.xlsx');
  logAudit(`${state.loggedUser.nome} exportou o histórico de ocorrências.`);
}
function exportPresenca(){
  const data = [];
  Object.keys(state.registros).forEach(key=>{
    const [cid,data_] = key.split('|');
    const c = state.colaboradores.find(x=>x.id===+cid);
    const r = state.registros[key];
    data.push({Colaborador:c?.nome||'', Data:data_, Situacao:r.tipo, Horario:r.hora||'', Observacao:r.obs});
  });
  data.sort((a,b)=>a.Data.localeCompare(b.Data));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Presenca');
  downloadWorkbook(wb, 'controle_presenca.xlsx');
  logAudit(`${state.loggedUser.nome} exportou o controle de presença.`);
}

        <div class="sub">Controle de presença e ocorrências de funcionários</div>

          <div class="field"><label>E-mail</label><input id="l_email" value="admin@empresa.com"></div>
          <div class="field"><label>Senha</label><input type="password" id="l_senha" value="admin123"></div>
          <button id="doLogin">Entrar</button>
          <div class="login-links">
            <a id="toRegister">Cadastrar novo usuário</a>
            <a id="forgot">Esqueci a senha</a>
          </div>
          <div class="hint">Acesso de demonstração já preenchido: admin@empresa.com / admin123.</div>
        ` : `
          <div class="field"><label>Nome</label><input id="r_nome"></div>
          <div class="field"><label>E-mail</label><input id="r_email"></div>
          <div class="field"><label>Senha</label><input type="password" id="r_senha"></div>
          <button id="doRegister">Cadastrar</button>
          <div class="login-links"><a id="toLogin">Já tenho uma conta</a></div>
        `}
      </div>
    </div>
  `;
  if(loginMode==='login'){
    document.getElementById('doLogin').onclick = ()=>{
      const email = document.getElementById('l_email').value.trim();
      const senha = document.getElementById('l_senha').value;
      const u = state.usuarios.find(x=>x.email===email && x.senha===senha);
      if(!u){ alert('E-mail ou senha inválidos.'); return; }
      if(!u.ativo){ alert('Este usuário está desativado.'); return; }
      state.loggedUser = u;
      logAudit(`${u.nome} entrou no sistema.`);
      render();
    };
    document.getElementById('toRegister').onclick = ()=>{ loginMode='register'; render(); };
    document.getElementById('forgot').onclick = ()=>{ alert('Um link de recuperação seria enviado ao e-mail cadastrado (funcionalidade de demonstração).'); };
  } else {
    document.getElementById('doRegister').onclick = ()=>{
      const nome = document.getElementById('r_nome').value.trim();
      const email = document.getElementById('r_email').value.trim();
      const senha = document.getElementById('r_senha').value;
      if(!nome||!email||!senha){ alert('Preencha todos os campos.'); return; }
      if(state.usuarios.some(u=>u.email===email)){ alert('Já existe um usuário com este e-mail.'); return; }
      const novo = {id:state.nextUserId++, nome, email, senha, nivel:'Usuário', ativo:true};
      state.usuarios.push(novo);
      state.loggedUser = novo;
      logAudit(`${nome} se cadastrou no sistema.`);
      render();
    };
    document.getElementById('toLogin').onclick = ()=>{ loginMode='login'; render(); };
  }
}
